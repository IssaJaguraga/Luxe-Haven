services:
  db:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: luxehaven
      DIRECTUS_DB_PASSWORD: ${DIRECTUS_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luxehaven"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: any

  directus:
    image: directus/directus:11.8.0
    environment:
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: luxehaven
      DB_USER: directus
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD}
      DB_POOL__MIN: "0"
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - directus_uploads:/directus/uploads
    networks: [backend, frontend]
    deploy:
      restart_policy:
        condition: any

  front:
    image: ghcr.io/issajaguraga/luxehaven-front:${FRONT_TAG}
    networks: [frontend]
    deploy:
      restart_policy:
        condition: any

  caddy:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [frontend]
    deploy:
      restart_policy:
        condition: any

volumes:
  db_data:
  directus_uploads:
  caddy_data:

networks:
  frontend:
    driver: overlay
    attachable: true
  backend:
    driver: overlay
    internal: true
