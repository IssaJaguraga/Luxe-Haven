# Supervision de la production : Prometheus collecte, Grafana affiche
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alertes.yml:/etc/prometheus/alertes.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [monitoring, luxehaven_frontend]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks: [monitoring]

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    networks: [monitoring, luxehaven_frontend]

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [monitoring]

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: overlay
  luxehaven_frontend:
    external: true
