- name: Ajouter la clé officielle de Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Ajouter le dépôt officiel de Docker
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable"
    state: present

- name: Installer Docker dans la version choisie
  apt:
    name:
      - "docker-ce={{ docker_version }}"
      - "docker-ce-cli={{ docker_version }}"
    state: present
    update_cache: yes
    allow_downgrade: yes

- name: Activer et démarrer Docker
  service:
    name: docker
    state: started
    enabled: yes
