name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Lint et tests du front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  image:
    name: Construction et publication de l'image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/issajaguraga/luxehaven-front:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t $IMAGE react-front
      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication de l'image
        if: github.event_name == 'push'
        run: docker push $IMAGE
