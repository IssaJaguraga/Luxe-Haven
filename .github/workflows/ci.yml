name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Lint et tests du front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  image:
    name: Construction et publication de l'image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/issajaguraga/luxehaven-front:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t $IMAGE react-front
      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication de l'image
        if: github.event_name == 'push'
        run: docker push $IMAGE

  deploy:
    name: Déploiement en préproduction
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Connexion à Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-deployer@luxehaven-project.iam.gserviceaccount.com

      - name: Installation de gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Ouverture du tunnel IAP
        run: |
          gcloud compute start-iap-tunnel preprod-vm 22 --local-host-port=localhost:2222 --zone=europe-west1-b --project=luxehaven-project &
          sleep 10

      - name: Lancement du script de déploiement
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[localhost]:2222 ${{ vars.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 2222 deploy@localhost "sudo deploy-front.sh ${{ github.sha }}"

  deploy-prod:
    name: Déploiement en production
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Connexion à Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-deployer@luxehaven-project.iam.gserviceaccount.com

      - name: Installation de gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Ouverture du tunnel IAP
        run: |
          gcloud compute start-iap-tunnel prod-vm 22 --local-host-port=localhost:2222 --zone=europe-west1-b --project=luxehaven-project &
          sleep 10

      - name: Lancement du script de déploiement
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_PROD }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[localhost]:2222 ${{ vars.DEPLOY_HOST_KEY_PROD }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 2222 deploy@localhost "sudo deploy-front.sh ${{ github.sha }}"
