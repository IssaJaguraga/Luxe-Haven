name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Lint et tests du front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  image:
    name: Construction de l'image Docker
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t luxehaven-front:${{ github.sha }} react-front
